name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android files
        run: |
          flutter create --platforms=android --org com.itechbuilders --project-name itb_shop .
          git checkout -- lib pubspec.yaml || true
      - name: Internet permission + app name
        run: |
          MANI=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANI" || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANI"
          sed -i 's#android:label="[^"]*"#android:label="iTechBuilders"#' "$MANI"
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
